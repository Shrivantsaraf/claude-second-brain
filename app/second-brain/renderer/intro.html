<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="intro.css" />
</head>
<body>
  <div id="win" class="win">
    <div id="bg"></div>
    <div id="status" class="status"></div>

    <div class="winhead">
      <span class="lights">
        <button class="lt red" id="lt-close" title="Hide (⌥Space)"></button>
        <button class="lt yel" id="lt-min" title="Minimize"></button>
        <button class="lt grn" id="lt-zoom" title="Zoom"></button>
      </span>
      <span class="wm">◈ SECOND&nbsp;BRAIN</span>
      <span class="hint">⌥Space to hide</span>
    </div>

    <div id="introbody">
      <div class="readout">
        <div class="title reveal">SECOND BRAIN</div>
        <div class="tag reveal">J.A.R.V.I.S · core online</div>
        <div class="rows">
          <div class="row reveal"><span class="l"><b></b>neural link</span><span class="v">ONLINE</span></div>
          <div class="row reveal"><span class="l"><b></b>memory core</span><span class="v">SYNCED</span></div>
          <div class="row reveal"><span class="l"><b></b>guardrails</span><span class="v">ARMED</span></div>
        </div>
      </div>
    </div>

    <div id="termpane"></div>
  </div>
  <script type="module" src="intro.js"></script>
</body>
</html>
